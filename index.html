<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polish Date Master</title>
    
    <link rel="stylesheet" href="styles.css">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff"> <link rel="icon" href="icon-192.png" type="image/png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PL Date Master">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
</head>
    
<body class="winter">
    <noscript>
        <div style="text-align: center; padding: 50px;">
            <h2>Oops! JavaScript is required.</h2>
            <p>Please enable JavaScript to use the Polish Date Master.</p>
        </div>
    </noscript>

    <div class="brand-header">
        <h1>Learn Polish Dates</h1>
    </div>

<header class="main-nav-container">
    <div class="utility-controls">
        <button id="navCalendar" class="nav-icon-btn active" title="Calendar">📅</button>
        <button id="navTime" class="nav-icon-btn" title="Time">🕒</button>
        <button id="navCulture" class="nav-icon-btn" title="Culture">📖</button>
        <button id="navRules" class="nav-icon-btn" title="Grammar">⚖️</button>
        
        <div class="divider"></div>
        
        <button id="meetingToggle" class="pill-btn mode-btn-written">Date: (On the...)</button>
        <button id="langToggle" class="pill-btn-sm">EN</button>
    </div>
</header>
<main class="app-content">
    <div id="viewCalendar" class="content-view">
        <section id="calendarSection">
            <div class="calendar-navigation">
                <div class="nav-controls-row">
                    <button id="prevMonth" class="nav-btn-arrow">←</button>
                    <div class="rollers-container">
                        <select id="monthRoller" class="roller-select"></select>
                        <input type="number" id="yearInput" value="2026">
                    </div>
                    <button id="nextMonth" class="nav-btn-arrow">→</button>
                </div>
            </div>

            <div class="calendar-container">
                <div class="weekdays"></div>
                <div id="calendarGrid" class="calendar-grid"></div>
            </div>
        </section>
    </div>

<div id="viewTime" class="content-view" style="display: none;">
    <div class="time-container">
        <div id="clock-face">
            <input type="time" id="timePicker" class="pill-btn">
            <button id="randomTimeBtn" class="pill-btn-sm" style="margin-top: 10px;">🎲 Random</button>
        </div>
        <div class="time-controls">
            <p class="hint-text">Select a time or hit Random to practice!</p>
        </div>
    </div>
</div>

    <div id="viewCulture" class="content-view" style="display:none;">
    </div>

    <div id="viewRules" class="content-view" style="display:none;">
    </div>
</main>

   

    <footer class="info-panel">
        <div class="phrase-display">
            <p id="plPhrase" class="phrase-pl">Wybierz datę</p>
            <p id="phoneticPhrase" class="phrase-phonetic">vye-byezh dah-teh</p>
            <p id="enPhrase" class="phrase-en">Select a date</p>
        </div>

        <div class="footer-controls">
            <button id="playBtn" class="pill-btn">🔊 Listen</button>
            <button id="repeatYearBtn" class="pill-btn">YEAR: ON</button>
        </div>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
